# Batch configuration file for Cardinal directions
# Specify the batch size, model, and other parameters for batch processing

batch_size: 3
model: zimage
prompt: "cartoon missippi river barge cargo: {cargo} boat facing: {direction} weathered"
negative_prompt: "no river background"
tags: ["cargo", "direction"]
cargo: ["coal", "empty"]
direction: ["east", "west", "north", "south", "northeast", "southeast", "southwest", "northwest"]
file_template: "assets/generated/barges/barge_{cargo}_{direction}.png"
